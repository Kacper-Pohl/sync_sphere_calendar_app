services:
  db:
    image: postgres:16-alpine
    container_name: calendar_db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: calendar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d calendar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: calendar_api
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    environment:
      - DATABASE_URL=postgresql://devuser:devpassword@db:5432/calendar_db?schema=public
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    command: sh -c "pnpm prisma generate --schema=./packages/database/prisma/schema.prisma && pnpm run dev --filter api"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        # Synchronizuj cały moduł API (łapie też pliki poza src/, np. nest-cli.json)
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - node_modules/
            - dist/
        # Synchronizuj paczki współdzielone
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
        # Przebuduj kontener gdy zmienią się zależności
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: calendar_web
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    command: pnpm run dev --filter web
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    develop:
      watch:
        # Synchronizuj cały moduł web (łapie też next-env.d.ts, middleware itd.)
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - node_modules/
            - .next/
        # Przebuduj gdy zmienią się zależności lub konfiguracja
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/tailwind.config.ts
        - action: rebuild
          path: ./apps/web/next.config.mjs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/e2e/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
      - e2e_app_node_modules:/app/apps/e2e/node_modules
    environment:
      - PLAYWRIGHT_BASE_URL=http://web:3000
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  api_node_modules:
  api_app_node_modules:
  web_node_modules:
  web_app_node_modules:
  e2e_node_modules:
  e2e_app_node_modules:
